<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景装饰圆 -->
  <circle cx="50" cy="50" r="35" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="350" cy="70" r="40" fill="url(#primaryGradient)" opacity="0.08"/>

  <!-- 主标题文字 -->
  <text x="200" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#primaryGradient)" filter="url(#softShadow)">
    Tappy
  </text>

  <!-- 装饰性下划线 -->
  <path d="M 140 85 Q 200 95 260 85" stroke="url(#accentGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 小图标点缀 -->
  <g transform="translate(320, 35)">
    <circle cx="0" cy="0" r="8" fill="url(#accentGradient)" opacity="0.9"/>
    <path d="M -3 -2 L 0 -5 L 3 -2 L 3 2 L 0 5 L -3 2 Z" fill="white" opacity="0.9"/>
  </g>

  <!-- 装饰点 -->
  <circle cx="100" cy="95" r="2" fill="url(#primaryGradient)" opacity="0.6"/>
  <circle cx="300" cy="95" r="2" fill="url(#accentGradient)" opacity="0.6"/>
</svg>
